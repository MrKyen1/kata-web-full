services:
  postgres:
    image: postgres:16
    container_name: kata_edu-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - kata_edu-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kata_edu-pgdata:
